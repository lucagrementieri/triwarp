site_name: triwarp
site_description: Triangular mesh library based on NVIDIA Warp
site_url: https://lucagrementieri.github.io/triwarp/
repo_url: https://github.com/lucagrementieri/triwarp
docs_dir: docs

# Read by Zensical (`zensical build` / `zensical serve`), not by MkDocs -- Zensical consumes
# `mkdocs.yml` as-is, so the filename and every key below are unchanged. Build the site with
# `--strict`, which is what fails on a dangling `[`name`][triwarp.old.path]` cross-reference.
#
# `docs/gen_ref_pages.py` must run first, every time: it materializes `docs/api/` and
# `docs/SUMMARY.md`, which `gen-files` used to serve from a virtual filesystem. Zensical has no
# `gen-files` equivalent and ignores the unsupported plugin entry silently, so a build without it
# yields a site with no API reference and only `--strict` reports it.
#
# No `exclude_docs:` here, though MkDocs had one for `assets/benchmarks/*.md` -- Zensical has no
# whole-file exclusion setting. Those sidecar tables carry `search: exclude: true` front matter
# instead (emitted by `benchmarks/plot_comparison.py`), which keeps them out of the search index;
# they are still built as unlinked pages, which nothing links to and the nav never shows.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
            - https://trimesh.org/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: true
            members_order: source
