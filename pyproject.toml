[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
description = "Triangular mesh library based on NVIDIA Warp"
name = "triwarp"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

dependencies = ["warp-lang>=1.13"]

[project.optional-dependencies]
dev = ["ruff>=0.9"]
test = [
    "pytest>=9.0",
    "embreex>=4.4",
    "manifold3d>=2.3.0",
    "pyvista>=0.48",
    "rtree>=0.12",
    "scipy>=1.17",
    "shapely>=2.1.2",
    "trimesh>=4.11",
]

[tool.setuptools.packages.find]
exclude = ["reference*"]
include = ["triwarp*"]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".pytest_cache", ".ruff_cache", ".venv", "build", "dist", "reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["triwarp"]

[tool.ruff.format]
skip-magic-trailing-comma = true
