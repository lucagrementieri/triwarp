[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
description = "Triangular mesh library based on NVIDIA Warp"
name = "triwarp"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

# ``triwarp.voxels`` is the package's first hard 1.16 dependency: it needs CPU
# ``wp.Volume.allocate_by_voxels`` (CUDA-only through 1.15) and ``Volume.get_active_stats``, which
# is the only occupancy read that is correct on a rebuildable grid.
dependencies = ["warp-lang>=1.16"]

[project.optional-dependencies]
io = ["meshio>=5.0", "numpy>=1.20"]

[dependency-groups]
bench = ["pytest-benchmark>=5.1", { include-group = "test" }]
dev = ["ruff>=0.9", "basedpyright>=1.39", "scipy-stubs>=1.17.1.5"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]
test = [
    "pytest>=9.0",
    "embreex>=4.4",
    "libigl>=2.6",
    "manifold3d>=2.3.0",
    "meshio>=5.3",
    "moderngl>=5.10",
    "networkx>=3.0",
    "numpy>=2.4.4",
    "pyvista>=0.48",
    "rtree>=0.12",
    "scipy>=1.17",
    "shapely>=2.1.2",
    "trimesh>=5.0.0rc1",
    "meshlib>=3.1.3.249",
    "open3d>=0.18",
    "pymeshlab>=2023.12",
    "potpourri3d>=1.4",
]


[tool.setuptools.packages.find]
exclude = ["reference*"]
include = ["triwarp*"]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "reference",
]

[tool.ruff.lint]
# Core rules to enable
select = [
    "F",   # Pyflakes (Severe syntax/runtime errors)
    "E",
    "W",   # Pycodestyle (Standard PEP 8 formatting)
    "I",   # Isort (Clean, sorted imports)
    "N",   # Pep8-naming (Mathematical & PEP8 naming conventions)
    "D",   # Pydocstyle (Enforces docstrings for complex geometry algorithms)
    "UP",  # Pyupgrade (Keeps syntax modern and performant)
    "YTT", # Sys.version checks (Prevents compatibility bugs)
    "BLE", # Blind-except (No generic 'except:')
    "B",   # Bugbear (Finds subtle, design-level bugs)
    "A",   # Builtins shadowing (Don't name a mesh variable 'id' or 'max')
    "ICN", # Import conventions (Forces 'import numpy as np')
    "PT",  # Pytest-style (Clean testing framework)
    "RUF", # Ruff-specific internal rules
]

ignore = [
    "D100", # Missing docstring in __init__
    "D103", # Missing docstring in public package
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method (e.g., __str__ usually doesn't need one)
    "D203", # Conflict fix: Prefer D211 (no blank line before class)
    "D212", # Conflict fix: Prefer D213 (summary on second line)
    "D413", # Missing blank line after last section
]

[tool.ruff.lint.per-file-ignores]
"triwarp/reduce.py" = ["A001"]

[tool.ruff.lint.isort]
known-first-party = ["triwarp"]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
trimesh = "tm"
warp = "wp"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.basedpyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["triwarp"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "reference",
    "site",
    # Warp's kernel DSL (wp.array[wp.vec3] subscripting, wp.tid(), typed vector
    # constructors, kernel-scope slicing) is not modeled by any type stubs, so
    # triwarp/kernels/ is inherently un-typecheckable. Excluded wholesale.
    "triwarp/kernels",
]
typeCheckingMode = "standard"

# Warp's Python-scope stubs are weak: wp.empty(dtype=wp.float32) is typed as
# returning array[float]; the twt.Array2d* aliases (wp.array[dtype, Literal[2]])
# are not assignable to Warp's array[Unknown, int]; BsrMatrix.offsets/.columns/
# .values exist at runtime but not in the stub; wp.max/wp.mean/wp.__getitem__
# overloads don't match. Every type-flow rule that touches a Warp array therefore
# fires on false positives. These are disabled so the residual diagnostics are
# actionable rather than drowned out. Trade-off: genuine wrapper type errors of
# these kinds are also silenced.
reportArgumentType = "none"
reportCallIssue = "none"
reportReturnType = "none"
reportAttributeAccessIssue = "none"
reportOperatorIssue = "none"
reportIndexIssue = "none"
reportAssignmentType = "none"
reportInconsistentOverload = "none"
reportOverlappingOverload = "none"
reportMissingTypeArgument = "none"
reportGeneralTypeIssues = "none"
reportInvalidTypeForm = "none"

# warp-lang and igl ship no py.typed marker / stubs.
reportMissingTypeStubs = "none"

# Keep as an error: catches the Warp §5 gotcha (a variable defined only inside an
# `if` branch reads as uninitialized when the branch isn't taken).
reportPossiblyUnboundVariable = "error"
