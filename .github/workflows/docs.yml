name: docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group docs

      # Zensical has no `gen-files` equivalent and ignores the unsupported plugin entry
      # silently, so this step is what puts `docs/api/` and `docs/SUMMARY.md` on disk. Skipping
      # it publishes a site with no API reference, which only the `--strict` build below reports.
      - name: Generate API reference pages
        run: uv run python docs/gen_ref_pages.py

      # `--strict` is the gate: it exits 1 on a dangling `[`name`][triwarp.old.path]`
      # cross-reference, which is the mechanical backstop for the five artifacts a moved or
      # renamed public function has to take with it (.claude/CLAUDE.md §4.4).
      - name: Build docs
        run: uv run zensical build --strict

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
